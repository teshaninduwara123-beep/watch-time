<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WatchTime — Track What You Watch</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171923;--line:#292c38;--muted:#9ca0af;--text:#f8f9fb;--pink:#ff315c;--green:#2fd47b;--yellow:#ffc857;--blue:#6ea8fe;--shadow:0 18px 55px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% -10%,#22243a 0,#08090d 35%);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
aside{width:245px;background:#0d0f14eF;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:25px 15px;z-index:30;backdrop-filter:blur(16px)}
.logo{font-size:27px;font-weight:950;color:var(--pink);padding:2px 12px 30px;cursor:pointer;letter-spacing:-1px}.logo span{color:#fff}.logo:hover{transform:translateX(2px)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#a7aab7;padding:12px;border-radius:10px;text-align:left;margin:3px 0;transition:.18s}.navbtn:hover,.navbtn.active{background:#1b1e28;color:#fff}.navbtn.active{color:var(--pink)}.side-title{color:#666b79;font-size:10px;text-transform:uppercase;padding:22px 12px 7px;letter-spacing:1.3px}.library-link{font-size:13px}
main{margin-left:245px;width:calc(100% - 245px)}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:14px;position:sticky;top:0;background:#08090deF;backdrop-filter:blur(16px);z-index:20}.search-wrap{position:relative;max-width:530px;width:100%}.search{width:100%;background:#151821;border:1px solid var(--line);border-radius:25px;padding:12px 45px 12px 18px;color:#fff;outline:none}.search:focus{border-color:#555a70;box-shadow:0 0 0 3px #ff315c18}.search-go{position:absolute;right:7px;top:5px;border:0;background:#262a37;color:#fff;border-radius:50%;width:34px;height:34px}.search-suggest{position:absolute;top:52px;left:0;right:0;background:#12141b;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:60}.search-suggest.open{display:block}.suggest-row{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid #252832}.suggest-row:last-child{border-bottom:0}.suggest-row img{width:34px;height:48px;object-fit:cover;border-radius:5px}.suggest-row b{display:block}.suggest-row small{color:var(--muted)}.drive-btn{margin-left:auto;white-space:nowrap}.avatar{width:39px;height:39px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#ff315c,#7c3aed);display:grid;place-items:center;font-weight:900;border:1px solid #ffffff1a}.avatar img{width:100%;height:100%;object-fit:cover}
.page{padding:30px 34px 55px}.hero{min-height:355px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:38px;background-position:center;background-size:cover;position:relative;margin-bottom:36px;box-shadow:var(--shadow);transition:background-image .4s}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08090df5 0,#08090db8 45%,#08090d22 75%,#08090d00),linear-gradient(0deg,#08090dca,transparent 55%)}.hero>*{position:relative}.hero h1{font-size:44px;line-height:1;margin:0 0 11px;letter-spacing:-1.5px}.hero p{max-width:600px;color:#d5d7df;line-height:1.65;margin:0 0 20px}.hero-meta{color:#bbbfd0;margin-bottom:14px}.btn{border:0;border-radius:9px;background:var(--pink);color:#fff;font-weight:800;padding:10px 15px;transition:.15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.alt{background:#282c38}.btn.green{background:var(--green);color:#06130d}.btn.blue{background:#2a66c9}.btn.danger{background:#5b2631}.btn.small{padding:7px 10px;font-size:12px}.section{margin:30px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.section-head h2{margin:0;font-size:20px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#141720;color:#bbbfd0;border-radius:999px;padding:7px 11px}.chip.active{background:#ff315c1b;color:#fff;border-color:#ff315c55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #1c1f28;border-radius:12px;overflow:hidden;transition:.2s;position:relative;box-shadow:0 7px 25px #0003}.card:hover{transform:translateY(-5px);border-color:#3c4150}.poster-wrap{position:relative}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#20232d}.plus{position:absolute;right:8px;top:8px;width:35px;height:35px;border:1px solid #fff3;background:#080a0dcc;color:#fff;border-radius:50%;font-size:20px;z-index:2}.plus:hover{background:var(--pink)}.info{padding:11px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:12px;margin-top:6px}.star{color:var(--yellow)}.progress{height:4px;background:#292d37;margin-top:9px;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink)}.badge{position:absolute;top:9px;left:9px;background:#000b;border:1px solid #444;padding:5px 7px;border-radius:6px;font-size:11px}.empty{border:1px dashed #343844;padding:35px;border-radius:12px;text-align:center;color:var(--muted);grid-column:1/-1}.empty h3{color:#fff;margin-top:0}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.list-tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}.list-tile:hover{border-color:#4a4e5d}.list-tile b{font-size:16px}.list-count{color:var(--muted);margin-top:6px}.list-actions{display:flex;gap:7px;margin-top:12px}
.profile{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center;background:linear-gradient(135deg,#161923,#101219);padding:25px;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.bigavatar{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;background:linear-gradient(135deg,#ff315c,#7c3aed);overflow:hidden;border:3px solid #ffffff16}.bigavatar img{width:100%;height:100%;object-fit:cover}.profile-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-top:20px}.stat{background:#0d1017;border:1px solid #242832;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.analytics{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.bar{height:10px;background:#282c37;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#8b5cf6)}.activity{display:flex;flex-direction:column;gap:8px}.activity-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #252832}.activity-row:last-child{border-bottom:0}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{color:var(--muted);font-size:11px;text-align:center;padding:5px}.day{min-height:115px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer}.day.muted-day{opacity:.4}.day.today{border-color:var(--pink);box-shadow:inset 0 0 0 1px #ff315c55}.day strong{font-size:12px}.day-event{margin-top:7px;background:#ff315c16;border-left:3px solid var(--pink);padding:5px 6px;border-radius:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-event img{width:18px;height:25px;object-fit:cover;vertical-align:middle;border-radius:2px;margin-right:4px}.calendar-note{margin-top:12px;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:70;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex;animation:fade .16s}.box{width:min(1000px,100%);max-height:93vh;overflow:auto;background:#151820;border:1px solid #303440;border-radius:16px;position:relative;box-shadow:var(--shadow)}@keyframes fade{from{opacity:0}to{opacity:1}}.back{height:300px;background:center/cover;position:relative}.back:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,#151820 98%)}.close{position:absolute;right:16px;top:14px;z-index:4;width:38px;height:38px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:22px}.content{padding:0 32px 30px;margin-top:-68px;position:relative}.content h2{font-size:34px;margin:0 0 8px}.overview{color:#d0d2db;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.action-menu{display:none;position:absolute;z-index:80;background:#171a23;border:1px solid #3b3f4c;border-radius:12px;box-shadow:var(--shadow);padding:7px;width:230px}.action-menu.open{display:block}.action-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#fff;padding:10px;border-radius:8px}.action-menu button:hover{background:#262a36}.cast{display:flex;gap:10px;overflow:auto;padding-bottom:8px}.cast-card{min-width:88px}.cast-card img{width:76px;height:100px;object-fit:cover;border-radius:7px;background:#242733}.cast-card b{font-size:11px;display:block;margin-top:5px}.cast-card small{color:var(--muted);font-size:10px}.similar{display:flex;gap:12px;overflow:auto}.similar .mini{min-width:115px;width:115px}.similar img{width:115px;height:170px;object-fit:cover;border-radius:8px}.season{margin-top:27px}.season-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.episode{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#20242e;padding:13px;border-radius:8px;margin:7px 0}.episode small{color:var(--muted)}.episode button{border:1px solid #555;background:transparent;color:#fff;padding:7px 10px;border-radius:6px}.episode button.done{background:var(--green);border-color:var(--green);color:#06130d}
.form{display:grid;gap:12px}.form input,.form select{background:#0e1118;color:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;outline:none}.toast{position:fixed;right:20px;bottom:20px;background:#222631;border:1px solid #444b5a;padding:12px 16px;border-radius:9px;display:none;z-index:100}.loading{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:900px){aside{width:68px;padding:20px 8px}.logo{font-size:0;padding:2px 9px 25px}.logo:after{content:'W';font-size:25px;color:var(--pink)}.navbtn span,.side-title{display:none}main{margin-left:68px;width:calc(100% - 68px)}.top{padding:0 15px}.page{padding:20px 15px}.hero{padding:25px;min-height:320px}.hero h1{font-size:34px}.profile{grid-template-columns:1fr;text-align:center}.bigavatar{margin:auto}.stats{grid-template-columns:repeat(2,1fr)}.analytics{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.cal-head{display:none}.day{min-height:90px}.drive-btn{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo" id="logo">Watch<span>Time</span></div>
  <button class="navbtn active" data-page="home">🏠 <span>Home</span></button>
  <button class="navbtn" data-page="discover">🔎 <span>Discover</span></button>
  <button class="navbtn" data-page="library">📚 <span>My Library</span></button>
  <button class="navbtn" data-page="calendar">📅 <span>Calendar</span></button>
  <button class="navbtn" data-page="profile">👤 <span>Profile & Analytics</span></button>
  <div class="side-title">Your library</div>
  <button class="navbtn library-link" data-page="watched">✓ <span>Watched</span></button>
  <button class="navbtn library-link" data-page="plan">🕒 <span>Plan to Watch</span></button>
  <button class="navbtn library-link" data-page="favorites">★ <span>Favorites</span></button>
</aside>
<main>
<header class="top">
  <div class="search-wrap">
    <input id="search" class="search" autocomplete="off" placeholder="Search shows, movies, anime…">
    <button class="search-go" id="searchGo">⌕</button>
    <div id="suggestions" class="search-suggest"></div>
  </div>
  <button id="driveBtn" class="btn alt drive-btn">☁ Connect Drive</button>
  <button id="avatarBtn" class="avatar" title="Open profile">W</button>
</header>
<div class="page" id="page"></div>
</main></div>

<div class="modal" id="modal"><div class="box">
  <button class="close" id="modalClose">×</button><div class="back" id="back"></div>
  <div class="content">
    <h2 id="mtitle"></h2><div class="muted" id="mmeta"></div><p class="overview" id="moverview"></p>
    <div class="actions"><button class="btn" id="menuBtn">＋ Add to…</button><button class="btn alt" id="modalWatchBtn"></button><button class="btn alt" id="favBtn">☆ Favorite</button><select id="categorySelect" class="btn alt" style="border:0"><option>TV Series</option><option>Anime</option><option>Movie</option><option>Game</option></select></div>
    <div class="panel" id="creditsPanel"><h3>Cast</h3><div id="cast" class="cast"></div></div>
    <div class="panel" style="margin-top:15px"><h3>More like this</h3><div id="similar" class="similar"></div></div>
    <div class="season"><div class="season-head"><h3>Episodes</h3><select id="seasonSelect"></select><button class="btn small alt" id="seasonAllBtn">Watch All</button></div><div id="episodes"></div></div>
  </div>
</div></div>
<div class="modal" id="menuModal"><div class="box" style="max-width:390px"><button class="close" id="menuClose">×</button><div class="content" style="margin-top:0;padding-top:28px"><h2 style="font-size:25px">Add this to…</h2><div id="menuOptions"></div></div></div></div>
<div class="modal" id="listModal"><div class="box" style="max-width:430px"><button class="close" id="listClose">×</button><div class="content" style="margin-top:0;padding-top:28px"><h2 style="font-size:25px">Create a list</h2><div class="form"><input id="newListName" placeholder="e.g. Anime, Weekend, Rewatch"><button class="btn" id="createListBtn">Create list</button></div></div></div></div>
<div class="modal" id="avatarModal"><div class="box" style="max-width:430px"><button class="close" id="avatarClose">×</button><div class="content" style="margin-top:0;padding-top:28px"><h2 style="font-size:25px">Edit profile picture</h2><p class="muted">Choose an image from your device. It stays in this browser and is included in Drive backup.</p><div class="form"><input type="file" id="avatarFile" accept="image/*"><button class="btn" id="removeAvatar">Remove picture</button></div></div></div></div>
<div class="toast" id="toast"></div>

<script>
const IMG='https://image.tmdb.org/t/p/w500',BACK='https://image.tmdb.org/t/p/original';
const LS={state:'wt_state_v3',avatar:'wt_avatar',lists:'wt_lists_v3',driveFile:'wt_drive_file_id'};
const defaultLists={watched:[],plan:[],favorites:[]};
let state=loadState();
function loadState(){try{const old=JSON.parse(localStorage.getItem('wt_state_v3')||'null');if(old)return normalize(old)}catch{};return normalize({page:'home',watchedEpisodes:{},lists:{...defaultLists},customLists:{},categories:{},activity:[],profile:{name:'WatchTime User'}})}
function normalize(s){s=s||{};s.lists={...defaultLists,...(s.lists||{})};s.watchedEpisodes=s.watchedEpisodes||s.watched||{};s.customLists=s.customLists||{};s.categories=s.categories||{};s.activity=s.activity||[];s.profile=s.profile||{name:'WatchTime User'};return s}
function save(){localStorage.setItem(LS.state,JSON.stringify(state))}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){const t=$('toast');t.textContent=x;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1900)}
async function api(path){const r=await fetch('/api/tmdb?path='+encodeURIComponent(path));if(!r.ok)throw Error('API error');return r.json()}
function idsFor(list){return [...new Set((state.lists[list]||[]).map(Number))]}
function isIn(list,id){return (state.lists[list]||[]).includes(Number(id))}
function addTo(list,id){id=Number(id);state.lists[list]=state.lists[list]||[];if(!state.lists[list].includes(id)){state.lists[list].push(id);logActivity('Added',id,list);save();backupProgress();toast('Added to '+listLabel(list))}}
function removeFrom(list,id){state.lists[list]=(state.lists[list]||[]).filter(x=>x!==Number(id));save();backupProgress()}
function listLabel(k){if(k==='plan')return 'Plan to Watch';if(k==='favorites')return 'Favorites';if(k==='watched')return 'Watched';return state.customLists[k]||k}
function allListKeys(){return ['watched','plan','favorites',...Object.keys(state.customLists)]}
function listEntries(){return allListKeys().map(k=>({key:k,name:listLabel(k),count:(state.lists[k]||[]).length}))}
function logActivity(action,showId,detail){state.activity.unshift({time:new Date().toISOString(),action,showId:Number(showId),detail});state.activity=state.activity.slice(0,150)}
function setCategory(id,c){state.categories[id]=c;save();backupProgress()}
function card(s,opts={}){if(!s)return '';const id=Number(s.id),media=s.media_type||(s.title?'movie':'tv');const watchedCount=Object.keys(state.watchedEpisodes).filter(k=>k.startsWith(id+'-')).length;const inWatched=isIn('watched',id);return `<div class="card" data-id="${id}" data-media="${media}"><div class="poster-wrap"><img class="poster" loading="lazy" src="${s.poster_path?IMG+s.poster_path:''}" alt="${esc(s.name||s.title)}"><button class="plus" title="Add to list">＋</button>${inWatched?'<span class="badge">✓ Watched</span>':''}</div><div class="info"><div class="name">${esc(s.name||s.title)}</div><div class="sub"><span class="star">★</span> ${(s.vote_average||0).toFixed(1)} · ${(s.first_air_date||s.release_date||'').slice(0,4)}</div>${watchedCount?`<div class="progress"><i style="width:${Math.min(100,watchedCount*8)}%"></i></div>`:''}</div></div>`}
function renderGrid(title,items,sub=''){return `<div class="section-head"><div><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div><span class="muted">${items.length} items</span></div><div class="grid">${items.length?items.map(card).join(''):'<div class="empty"><h3>Nothing here yet</h3><div>Add a show using the ＋ button on any poster.</div></div>'}</div>`}
function bindCards(root=document){root.querySelectorAll('.card').forEach(c=>{const id=Number(c.dataset.id),media=c.dataset.media||'tv';c.querySelector('.poster').onclick=()=>loadShowById(id,media);c.querySelector('.name').onclick=()=>loadShowById(id,media);c.querySelector('.plus').onclick=e=>{e.stopPropagation();openAddMenu(id)}})}
async function loadShowById(id,media='tv'){try{const s=await api('/'+(media==='movie'?'movie':'tv')+'/'+id);s.media_type=media;openShow(s)}catch{toast('Could not load that title')}}
async function home(){try{const d=await api('/trending/tv/week');const items=(d.results||[]).filter(x=>x.backdrop_path||x.poster_path);const hero=items[Math.floor(Math.random()*Math.max(1,Math.min(items.length,15)))]||items[0];const heroBg=hero?BACK+(hero.backdrop_path||hero.poster_path):'';$('page').innerHTML=`<section class="hero" style="background-image:url('${heroBg}')"><div><div class="hero-meta">Random spotlight · ${hero?esc((hero.first_air_date||'').slice(0,4)):''}</div><h1>${hero?esc(hero.name):'Track what you watch.'}</h1><p>${hero?esc(hero.overview||'Discover your next favorite show and keep every episode organized.'): 'Discover shows, follow episodes, build lists and keep your viewing history in one place.'}</p><button class="btn" id="heroBtn">${hero?'Open show':'Discover shows'}</button></div></section>${renderGrid('Trending this week',items.slice(0,14))}`;if(hero)$('heroBtn').onclick=()=>openShow(hero);bindCards()}catch(e){$('page').innerHTML='<div class="empty">TMDB could not be loaded. Check your Vercel API key.</div>'}}
let searchTimer;
async function searchShows(q){q=q.trim();if(!q)return discover();try{const d=await api('/search/multi?query='+encodeURIComponent(q));let items=(d.results||[]).filter(x=>x.media_type==='tv'||x.media_type==='movie');if(!items.length){const p=await api('/search/tv?query='+encodeURIComponent(q));items=p.results||[]}if(!items.length){const pop=await api('/trending/tv/week');items=closestMatches(q,pop.results||[])}$('page').innerHTML=`<div class="section-head"><div><h2>Search results</h2><div class="muted">Showing matches for “${esc(q)}”</div></div></div><div class="toolbar" style="margin-bottom:16px"><button class="chip active">All</button><button class="chip" onclick="movieSearch('${esc(q)}')">Movies</button><button class="chip" onclick="discover('${esc(q)}')">TV</button></div><div class="grid">${items.length?items.map(card).join(''):'<div class="empty"><h3>No exact match</h3><div>Try a simpler title or check the suggested spelling above.</div></div>'}</div>`;bindCards();showSuggestions(q,items.slice(0,5),true)}catch{$('page').innerHTML='<div class="empty">Search is temporarily unavailable.</div>'}}
function closestMatches(q,items){const n=normalizeText(q);return items.map(x=>({...x,__score:similarity(n,normalizeText(x.name||x.title))})).filter(x=>x.__score>.45).sort((a,b)=>b.__score-a.__score).slice(0,10)}
function normalizeText(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').trim()}
function levenshtein(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n]}
function similarity(a,b){if(!a||!b)return 0;if(a===b)return 1;const d=levenshtein(a,b);return 1-d/Math.max(a.length,b.length)}
async function movieSearch(q){try{const d=await api('/search/movie?query='+encodeURIComponent(q));$('page').innerHTML=`<div class="section-head"><h2>Movie results</h2></div><div class="grid">${(d.results||[]).map(x=>card({...x,name:x.title,first_air_date:x.release_date,media_type:'movie'})).join('')}</div>`;bindCards()}catch{toast('Movie search failed')}}
async function discover(q=''){try{const d=q?await api('/search/tv?query='+encodeURIComponent(q)):await api('/tv/popular');$('page').innerHTML=renderGrid(q?'TV search':'Popular TV shows',d.results||[]);bindCards()}catch{$('page').innerHTML='<div class="empty">Unable to load shows.</div>'}}
function showSuggestions(q,items,correction=false){const box=$('suggestions');if(!q||!items.length){box.classList.remove('open');return}box.innerHTML=(correction?`<div class="suggest-row"><div><b>Did you mean?</b><small>Try one of these matches</small></div></div>`:'')+items.map(x=>`<div class="suggest-row" data-id="${x.id}" data-media="${x.media_type||'tv'}"><img src="${x.poster_path?IMG+x.poster_path:''}"><div><b>${esc(x.name||x.title)}</b><small>${x.media_type==='movie'?'Movie':'TV'} · ${(x.first_air_date||x.release_date||'').slice(0,4)}</small></div></div>`).join('');box.classList.add('open');box.querySelectorAll('.suggest-row[data-id]').forEach(r=>r.onclick=()=>{box.classList.remove('open');loadShowById(r.dataset.id,r.dataset.media||'tv')})}
async function updateSuggestions(q){if(q.length<2){$('suggestions').classList.remove('open');return}try{const d=await api('/search/multi?query='+encodeURIComponent(q));let items=(d.results||[]).filter(x=>x.media_type==='tv'||x.media_type==='movie').slice(0,5);if(items.length)showSuggestions(q,items)}catch{}}
async function fetchShows(ids){const arr=[];for(const id of [...new Set(ids)].slice(0,40)){try{arr.push(await api('/tv/'+id))}catch{}}return arr}
async function libraryPage(filter='library'){const all=listEntries();if(filter==='library'){$('page').innerHTML=`<div class="section-head"><div><h2>My Library</h2><div class="muted">Your lists, collections and progress.</div></div><button class="btn" onclick="openCreateList()">＋ New list</button></div><div class="list-grid">${all.map(x=>`<div class="list-tile" onclick="openList('${x.key}')"><b>${esc(x.name)}</b><div class="list-count">${x.count} shows</div><div class="list-actions"><button class="btn small alt" onclick="event.stopPropagation();openList('${x.key}')">Open</button>${!['watched','plan','favorites'].includes(x.key)?`<button class="btn small danger" onclick="event.stopPropagation();deleteList('${x.key}')">Delete</button>`:''}</div></div>`).join('')}</div>`;return}await openList(filter)}
async function openList(key){$('page').innerHTML='<div class="loading">Loading '+esc(listLabel(key))+'…</div>';try{const shows=await fetchShows(state.lists[key]||[]);$('page').innerHTML=`<div class="section-head"><div><h2>${esc(listLabel(key))}</h2><div class="muted">${shows.length} shows</div></div><button class="btn alt" onclick="libraryPage('library')">← All lists</button></div>${renderGrid('',shows)}`;bindCards()}catch{$('page').innerHTML='<div class="empty"><h3>Library could not be loaded</h3><div>Please try again.</div></div>'}}
async function watched(){openList('watched')}async function plan(){openList('plan')}async function favorites(){openList('favorites')}
function openCreateList(){$('listModal').classList.add('open');$('newListName').focus()}
function createList(){const n=$('newListName').value.trim();if(!n)return;if(Object.values(state.customLists).some(x=>x.toLowerCase()===n.toLowerCase()))return toast('That list already exists');const key='list_'+Date.now();state.customLists[key]=n;state.lists[key]=[];save();backupProgress();$('listModal').classList.remove('open');$('newListName').value='';libraryPage('library');toast('List created')}
function deleteList(key){if(!confirm('Delete this list? The shows will not be deleted from other lists.'))return;delete state.customLists[key];delete state.lists[key];save();backupProgress();libraryPage('library')}
function openAddMenu(id){state.currentId=Number(id);const keys=allListKeys();$('menuOptions').innerHTML=keys.map(k=>`<button onclick="toggleListMembership('${k}',${id})">${isIn(k,id)?'✓ Remove from ':'＋ Add to '}${esc(listLabel(k))}</button>`).join('')+`<button onclick="openCreateListFromMenu()">＋ Create new list…</button><button onclick="closeMenuModal()">Close</button>`;$('menuModal').classList.add('open')}
function toggleListMembership(k,id){if(isIn(k,id))removeFrom(k,id);else addTo(k,id);openAddMenu(id);}
function openCreateListFromMenu(){$('menuModal').classList.remove('open');openCreateList()}
function closeMenuModal(){$('menuModal').classList.remove('open')}
async function openShow(s){state.current=s;const media=s.media_type||(s.title?'movie':'tv');state.current.media_type=media;$('modal').classList.add('open');$('back').style.backgroundImage=`url('${BACK}${s.backdrop_path||s.poster_path||''}')`;$('mtitle').textContent=s.name||s.title;$('mmeta').textContent=`${(s.first_air_date||s.release_date||'').slice(0,4)} · ★ ${(s.vote_average||0).toFixed(1)} · ${state.categories[s.id]||((media==='movie')?'Movie':'TV Series')}`;$('moverview').textContent=s.overview||'No overview available.';$('categorySelect').value=state.categories[s.id]||((media==='movie')?'Movie':'TV Series');$('categorySelect').onchange=()=>{state.categories[s.id]=$('categorySelect').value;save();backupProgress();$('mmeta').textContent=`${(s.first_air_date||s.release_date||'').slice(0,4)} · ★ ${(s.vote_average||0).toFixed(1)} · ${state.categories[s.id]}`;toast('Category saved')};updateModalButtons();$('cast').innerHTML='<div class="loading">Loading cast…</div>';$('similar').innerHTML='<div class="loading">Loading recommendations…</div>';$('episodes').innerHTML=media==='movie'?'<div class="empty"><h3>Movie</h3><div>Movies do not have episode tracking. Add it to Watched, Plan to Watch or Favorites above.</div></div>':'<div class="loading">Loading seasons…</div>';try{const base=media==='movie'?'/movie/':'/tv/';const [d,credits,sim]=await Promise.all([api(base+s.id),api(base+s.id+'/credits'),api(base+s.id+'/similar')]);state.current=d;state.current.media_type=media;renderCast(credits.cast||[]);renderSimilar(sim.results||[]);if(media==='tv')renderSeasons(d.seasons||[])}catch(e){if(media!=='movie')$('episodes').innerHTML='<div class="empty">Episode details are unavailable.</div>'}}
function updateModalButtons(){const id=Number(state.current.id);$('modalWatchBtn').textContent=isIn('watched',id)?'✓ In Watched':'Add to Watched';$('modalWatchBtn').onclick=()=>{isIn('watched',id)?removeFrom('watched',id):addTo('watched',id);updateModalButtons()};$('favBtn').textContent=isIn('favorites',id)?'★ Favorited':'☆ Favorite';$('favBtn').onclick=()=>{isIn('favorites',id)?removeFrom('favorites',id):addTo('favorites',id);updateModalButtons()}}
function renderCast(cast){$('cast').innerHTML=cast.slice(0,12).map(c=>`<div class="cast-card"><img src="${c.profile_path?IMG+c.profile_path:''}" alt="${esc(c.name)}"><b>${esc(c.name)}</b><small>${esc(c.character||'')}</small></div>`).join('')||'<div class="muted">No cast information.</div>'}
function renderSimilar(items){$('similar').innerHTML=items.slice(0,8).map(s=>`<div class="mini" onclick="loadShowById(${s.id},'${s.media_type||'tv'}')"><img src="${s.poster_path?IMG+s.poster_path:''}" alt="${esc(s.name)}"><div style="font-size:11px;margin-top:5px">${esc(s.name)}</div></div>`).join('')||'<div class="muted">No similar titles found.</div>'}
function renderSeasons(seasons){const valid=seasons.filter(x=>x.season_number>0);$('seasonSelect').innerHTML=valid.map(s=>`<option value="${s.season_number}">${esc(s.name)} · ${s.episode_count} eps</option>`).join('');$('seasonSelect').onchange=()=>loadSeason(Number($('seasonSelect').value));if(valid.length)loadSeason(valid[0].season_number);else $('episodes').innerHTML='<div class="empty">No seasons available.</div>'}
async function loadSeason(n){$('episodes').innerHTML='<div class="loading">Loading episodes…</div>';try{const d=await api('/tv/'+state.current.id+'/season/'+n);state.currentEpisodes=d.episodes||[];const allDone=state.currentEpisodes.length&&state.currentEpisodes.every(e=>!!state.watchedEpisodes[state.current.id+'-'+e.id]);$('seasonAllBtn').textContent=allDone?'Mark All Unwatched':'Watch All';$('seasonAllBtn').onclick=()=>toggleSeason();$('episodes').innerHTML=state.currentEpisodes.map(e=>{const key=state.current.id+'-'+e.id,done=!!state.watchedEpisodes[key];return `<div class="episode"><span><b>E${e.episode_number}</b> — ${esc(e.name)}<br><small>${e.air_date||'No air date'} · ${e.runtime||'?'} min</small></span><button class="${done?'done':''}" data-key="${key}">${done?'✓ Watched':'Mark watched'}</button></div>`}).join('');$('episodes').querySelectorAll('button').forEach(b=>b.onclick=()=>toggleEp(b.dataset.key,b))}catch{$('episodes').innerHTML='<div class="empty">Could not load this season.</div>'}}
function toggleSeason(){const eps=state.currentEpisodes||[];const all=eps.length&&eps.every(e=>state.watchedEpisodes[state.current.id+'-'+e.id]);eps.forEach(e=>{const k=state.current.id+'-'+e.id;if(all)delete state.watchedEpisodes[k];else state.watchedEpisodes[k]=true});if(!all){addTo('watched',state.current.id);logActivity('Watched season',state.current.id,'Season '+$('seasonSelect').value)}save();backupProgress();loadSeason(Number($('seasonSelect').value));toast(all?'Season marked unwatched':'Season marked watched')}
function toggleEp(key,b){if(state.watchedEpisodes[key]){delete state.watchedEpisodes[key]}else{state.watchedEpisodes[key]=true;const id=Number(key.split('-')[0]);addTo('watched',id);logActivity('Watched episode',id,key)}save();backupProgress();b.classList.toggle('done',!!state.watchedEpisodes[key]);b.textContent=state.watchedEpisodes[key]?'✓ Watched':'Mark watched';toast(state.watchedEpisodes[key]?'Episode marked watched':'Episode unmarked')}
function closeModal(){ $('modal').classList.remove('open') }
function closeAnyOnBackdrop(e){if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')}

async function calendar(){const now=new Date();if(!state.calMonth)state.calMonth=new Date(now.getFullYear(),now.getMonth(),1);$('page').innerHTML=`<div class="calendar-toolbar"><div><h2 style="margin:0">Calendar</h2><div class="muted">Real episode air dates from the shows you track.</div></div><div class="toolbar"><button class="btn alt small" id="calPrev">←</button><b id="calTitle"></b><button class="btn alt small" id="calNext">→</button></div></div><div id="calendarBody"><div class="loading">Loading your episode calendar…</div></div>`;$('calPrev').onclick=()=>{state.calMonth.setMonth(state.calMonth.getMonth()-1);calendar()};$('calNext').onclick=()=>{state.calMonth.setMonth(state.calMonth.getMonth()+1);calendar()};await buildCalendar()}
async function buildCalendar(){const y=state.calMonth.getFullYear(),m=state.calMonth.getMonth();$('calTitle').textContent=state.calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});const ids=[...new Set(Object.values(state.lists).flat().filter(x=>Number.isFinite(Number(x))).map(Number))].slice(0,15);const events=[];for(const id of ids){try{const d=await api('/tv/'+id);const s=d.seasons||[];const relevant=s.filter(x=>x.season_number>0).slice(-3);for(const ss of relevant){try{const ep=await api('/tv/'+id+'/season/'+ss.season_number);for(const e of ep.episodes||[]){if(!e.air_date)continue;const dt=new Date(e.air_date+'T00:00:00');if(dt.getFullYear()===y&&dt.getMonth()===m)events.push({date:e.air_date,show:d.name,ep:e.episode_number,id,poster:d.poster_path})}}catch{}}}catch{}}const first=new Date(y,m,1),last=new Date(y,m+1,0);let cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div class="day muted-day"></div>');for(let d=1;d<=last.getDate();d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=events.filter(x=>x.date===iso),today=new Date().toISOString().slice(0,10);cells.push(`<div class="day ${iso===today?'today':''}"><strong>${d}</strong>${ev.slice(0,4).map(e=>`<div class="day-event" onclick="loadShowById(${e.id})"><img src="${e.poster?IMG+e.poster:''}">E${e.ep} ${esc(e.show)}</div>`).join('')}${ev.length>4?`<div class="muted" style="font-size:10px;margin-top:5px">+${ev.length-4} more</div>`:''}</div>`)}$('calendarBody').innerHTML=`<div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.join('')}</div><div class="calendar-note">Calendar is populated from TMDB air dates for your tracked shows. If a network has not published an air date, it will not appear yet.</div>`}

function profile(){const epCount=Object.keys(state.watchedEpisodes).length,shows=new Set(Object.keys(state.watchedEpisodes).map(x=>x.split('-')[0])).size;const totalLists=listEntries().reduce((a,x)=>a+x.count,0);const games=(state.profile.games||[]).length;const categories={TV:0,Anime:0,Movie:0,Game:games};Object.values(state.categories).forEach(c=>{const k=c==='TV Series'?'TV':c;if(categories[k]!==undefined)categories[k]++});const activity=state.activity.slice(0,12);$('page').innerHTML=`<div class="profile"><div><div class="bigavatar" id="profileAvatar">${avatarHtml()}</div><div style="text-align:center;margin-top:9px"><button class="btn small alt" onclick="openAvatarEditor()">Edit picture</button></div></div><div><h1 style="margin:0 0 4px">${esc(state.profile.name||'WatchTime User')}</h1><p class="muted">Your viewing dashboard — real data from your WatchTime activity.</p><div class="profile-actions"><button class="btn small" onclick="go('library')">Open my library</button><button class="btn small alt" onclick="editProfileName()">Edit name</button><button class="btn small alt" onclick="addGame()">＋ Add game</button></div><div class="stats"><div class="stat"><b>${epCount}</b><span>Episodes watched</span></div><div class="stat"><b>${shows}</b><span>Series watched</span></div><div class="stat"><b>${state.lists.favorites.length}</b><span>Favorites</span></div><div class="stat"><b>${totalLists}</b><span>Items across lists</span></div></div></div></div><div class="section"><div class="section-head"><h2>Analytics</h2><span class="muted">Based on recorded activity</span></div><div class="analytics"><div class="panel"><h3>Categories</h3>${Object.entries(categories).map(([k,v])=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${Math.min(100,v*10)}%"></i></div></div>`).join('')}<p class="muted">Choose a category from a show's detail menu to make these statistics more useful.</p></div><div class="panel"><h3>Viewing activity</h3><div class="activity">${activity.length?activity.map(a=>`<div class="activity-row"><span>${esc(a.action)}${a.detail?' · '+esc(a.detail):''}</span><small class="muted">${new Date(a.time).toLocaleString()}</small></div>`).join(''):'<div class="muted">Your activity will appear here as you use WatchTime.</div>'}</div></div></div></div>`}
function addGame(){const n=prompt('Game name:');if(!n||!n.trim())return;const id='game_'+Date.now();state.categories[id]='Game';state.profile.games=state.profile.games||[];state.profile.games.unshift({id,name:n.trim(),time:new Date().toISOString()});logActivity('Added game',id,n.trim());save();backupProgress();profile();toast('Game added to your activity')}
function avatarHtml(){const a=localStorage.getItem(LS.avatar);return a?`<img src="${a}" alt="Profile picture">`:'W'}
function openAvatarEditor(){$('avatarModal').classList.add('open')}
function editProfileName(){const n=prompt('Your display name:',state.profile.name||'WatchTime User');if(n&&n.trim()){state.profile.name=n.trim();save();backupProgress();profile()}}
$('avatarFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem(LS.avatar,r.result);state.profile.avatar=r.result;save();backupProgress();$('avatarModal').classList.remove('open');profile();updateTopAvatar();toast('Profile picture updated')};r.readAsDataURL(f)};
$('removeAvatar').onclick=()=>{localStorage.removeItem(LS.avatar);delete state.profile.avatar;save();backupProgress();$('avatarModal').classList.remove('open');profile();updateTopAvatar()};function updateTopAvatar(){const a=localStorage.getItem(LS.avatar);$('avatarBtn').innerHTML=a?`<img src="${a}" alt="">`:'W'}

async function go(p){state.page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')return home();if(p==='discover')return discover();if(p==='library')return libraryPage('library');if(p==='watched')return watched();if(p==='plan')return plan();if(p==='favorites')return favorites();if(p==='calendar')return calendar();if(p==='profile')return profile()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));$('logo').onclick=()=>go('home');$('avatarBtn').onclick=()=>go('profile');$('searchGo').onclick=()=>searchShows($('search').value);$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>updateSuggestions($('search').value),300)});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('suggestions').classList.remove('open');searchShows(e.target.value)}});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('suggestions').classList.remove('open')});
$('modalClose').onclick=closeModal;$('modal').onclick=closeAnyOnBackdrop;$('menuBtn').onclick=()=>openAddMenu(state.current.id);$('menuClose').onclick=closeMenuModal;$('menuModal').onclick=closeAnyOnBackdrop;$('listClose').onclick=()=>$('listModal').classList.remove('open');$('listModal').onclick=closeAnyOnBackdrop;$('createListBtn').onclick=createList;$('avatarClose').onclick=()=>$('avatarModal').classList.remove('open');$('avatarModal').onclick=closeAnyOnBackdrop;document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));$('suggestions').classList.remove('open')}});

/* Google Drive backup: keep the hidden appDataFolder design, but persist the connection state locally and silently re-request a token after refresh. */
const GOOGLE_CLIENT_ID='119562103767-3jdsmbao6em287rn199n2cuceu0312k4.apps.googleusercontent.com';const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata';const DRIVE_FILE_NAME='watchtime-progress.json';let driveToken=null,driveFileId=localStorage.getItem(LS.driveFile)||null,tokenClient=null,driveConnected=localStorage.getItem('wt_drive_connected')==='1';
function driveReady(){return !!GOOGLE_CLIENT_ID&&!GOOGLE_CLIENT_ID.startsWith('YOUR_')}
function updateDriveButton(connected){driveConnected=connected;const b=$('driveBtn');b.textContent=connected?'☁ Drive connected':'☁ Connect Drive';b.title=connected?'Google Drive is connected. Click to reconnect/sync.':'Connect Google Drive';}
function initGoogle(){if(!driveReady()||!window.google?.accounts?.oauth2)return;tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:async resp=>{if(resp.error){updateDriveButton(driveConnected);if(!driveConnected)toast('Connect Drive to enable backup');return}driveToken=resp.access_token;localStorage.setItem('wt_drive_connected','1');updateDriveButton(true);await syncFromDrive()}})}
function connectDrive(){if(!driveReady())return alert('Add your Google OAuth Web Client ID in public/index.html first.');if(!tokenClient)initGoogle();setTimeout(()=>tokenClient?.requestAccessToken({prompt:driveConnected?'none':'consent'}),200)}
async function silentDriveReconnect(){if(!driveReady())return; if(!tokenClient)initGoogle();setTimeout(()=>{if(tokenClient&&driveConnected)tokenClient.requestAccessToken({prompt:'none'})},1200)}
function drivePayload(){return JSON.stringify({version:3,savedAt:new Date().toISOString(),watch:state.lists.plan,watched:state.lists.watched,favorites:state.lists.favorites,lists:state.lists,customLists:state.customLists,watchedEpisodes:state.watchedEpisodes,categories:state.categories,activity:state.activity,profile:state.profile,avatar:localStorage.getItem(LS.avatar)||null})}
async function driveRequest(url,options={}){if(!driveToken)throw Error('Drive is not connected');const r=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+driveToken}});if(!r.ok)throw Error(await r.text());return r}
async function findDriveFile(){const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;const url='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=10&q='+encodeURIComponent(q);const data=await (await driveRequest(url)).json();return data.files?.[0]||null}
async function saveToDrive(){if(!driveToken)return;try{let id=driveFileId;if(!id){const existing=await findDriveFile();id=existing?.id||null}const body=drivePayload();if(id){await driveRequest('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body})}else{const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder'],mimeType:'application/json'};const boundary='watchtime_'+Date.now();const multipart=['--'+boundary,'Content-Type: application/json; charset=UTF-8','',JSON.stringify(meta),'--'+boundary,'Content-Type: application/json','',body,'--'+boundary+'--',''].join('\r\n');const r=await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multipart});id=(await r.json()).id}driveFileId=id;localStorage.setItem(LS.driveFile,id);updateDriveButton(true)}catch(e){console.warn(e);toast('Drive backup failed')}}
async function syncFromDrive(){try{const f=await findDriveFile();if(!f){await saveToDrive();toast('Drive backup created');return}driveFileId=f.id;localStorage.setItem(LS.driveFile,f.id);const data=await(await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media')).json();if(data){state.lists={...defaultLists,...(data.lists||{})};state.lists.plan=[...new Set([...(state.lists.plan||[]),...(data.watch||[])])];state.lists.watched=[...new Set([...(state.lists.watched||[]),...(data.watched||[])])];state.lists.favorites=[...new Set([...(state.lists.favorites||[]),...(data.favorites||[])])];state.customLists={...(data.customLists||{}),...state.customLists};state.watchedEpisodes={...(data.watchedEpisodes||{}),...state.watchedEpisodes};state.categories={...(data.categories||{}),...state.categories};state.activity=[...(data.activity||[]),...state.activity].slice(0,150);state.profile={...(data.profile||{}),...state.profile};if(data.avatar&&!localStorage.getItem(LS.avatar))localStorage.setItem(LS.avatar,data.avatar);save();updateTopAvatar();toast('Drive data synced');go(state.page||'home')}}catch(e){console.warn('Drive sync failed',e);toast('Drive sync failed')}}
let saveTimer;function backupProgress(){save();if(driveToken){clearTimeout(saveTimer);saveTimer=setTimeout(saveToDrive,700)}}
$('driveBtn').onclick=connectDrive;
window.addEventListener('load',()=>{updateTopAvatar();updateDriveButton(driveConnected);setTimeout(()=>{initGoogle();silentDriveReconnect()},800);go('home')});
</script>

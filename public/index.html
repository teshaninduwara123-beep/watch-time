<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WatchTime — Track What You Watch</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#09090d;--panel:#111118;--panel2:#18181f;--line:#272731;--muted:#9a9aa5;--text:#fff;--pink:#ff315c;--green:#32d583;--yellow:#ffc857;--blue:#5b8cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
aside{width:240px;background:#0d0d12;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:26px 16px;z-index:20;overflow:auto}.logo{font-size:26px;font-weight:900;color:var(--pink);padding:0 12px 32px;cursor:pointer}.logo span{color:#fff}.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#9d9da8;padding:13px 12px;border-radius:9px;text-align:left;margin:3px 0}.navbtn:hover,.navbtn.active{background:#1b1b23;color:#fff}.navbtn.active{color:var(--pink)}.side-title{color:#666875;font-size:11px;text-transform:uppercase;padding:25px 12px 8px;letter-spacing:1px}.custom-list-row{display:flex;align-items:center;gap:4px}.custom-list-row .navbtn{flex:1}.small-del{border:0;background:transparent;color:#666;padding:7px}.add-list{margin:8px 12px;border:1px dashed #3b3b48;background:transparent;color:#bbb;border-radius:8px;padding:8px;width:calc(100% - 24px)}
main{margin-left:240px;width:calc(100% - 240px)}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 35px;gap:18px;position:sticky;top:0;background:#09090df2;backdrop-filter:blur(12px);z-index:10}.search{max-width:430px;width:100%;background:#15151d;border:1px solid var(--line);border-radius:24px;padding:11px 18px;color:#fff;outline:none}.drive-wrap{margin-left:auto;display:flex;gap:7px;align-items:center}.drive-status{font-size:11px;color:var(--green);display:none}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff315c,#8b5cf6);display:grid;place-items:center;font-weight:800;border:2px solid transparent;cursor:pointer}.avatar:hover{border-color:#fff}
.page{padding:32px 35px}.hero{min-height:330px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:36px;background-position:center;background-size:cover;margin-bottom:38px;position:relative;transition:background-image .45s ease}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#111 5%,#111c 48%,transparent);pointer-events:none}.hero>div{position:relative;z-index:1}.hero h1{font-size:44px;margin:0 0 10px}.hero p{max-width:570px;color:#ccc;line-height:1.65;margin:0 0 20px}.btn{border:0;border-radius:8px;background:var(--pink);color:#fff;font-weight:800;padding:11px 18px}.btn.alt{background:#282832}.btn.green{background:var(--green);color:#07150d}.btn.blue{background:var(--blue)}.section{margin:30px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-head h2{margin:0;font-size:20px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #191922;border-radius:10px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-5px);border-color:#383844}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.info{padding:11px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:12px;margin-top:6px}.star{color:var(--yellow)}.progress{height:4px;background:#292932;margin-top:9px;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink)}.badge{position:absolute;top:9px;left:9px;background:#000b;border:1px solid #444;padding:5px 7px;border-radius:6px;font-size:11px}.quick{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#000c;color:#fff;font-size:22px;z-index:2}.quick:hover{background:var(--pink)}
.empty{border:1px dashed #34343e;padding:35px;border-radius:12px;text-align:center;color:var(--muted);grid-column:1/-1}.profile{display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:center;background:var(--panel);padding:25px;border:1px solid var(--line);border-radius:15px}.bigavatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;background:linear-gradient(135deg,#ff315c,#7c3aed);cursor:pointer}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:14px;margin-top:18px}.stat{background:#18181f;padding:14px;border-radius:10px;border:1px solid #252531}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.metric b{font-size:25px;display:block;margin-top:5px}.bar{height:9px;background:#282832;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{height:100%;display:block;background:var(--pink)}.chip{display:inline-block;padding:5px 9px;border-radius:20px;background:#22222b;margin:4px 4px 0 0;color:#ddd}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:105px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}.day strong{font-size:12px}.dot{margin-top:9px;color:var(--pink);font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex;animation:fade .16s ease}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#15151b;border:1px solid #30303a;border-radius:15px;position:relative;animation:pop .18s ease}.back{height:300px;background:center/cover}.back:after{content:"";display:block;height:100%;background:linear-gradient(transparent,#15151b)}.close{position:absolute;right:16px;top:14px;z-index:3;width:36px;height:36px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:20px}.content{padding:0 32px 30px;margin-top:-65px;position:relative}.content h2{font-size:32px;margin:0 0 8px}.overview{color:#ccc;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}.season{margin-top:26px}.season-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.episode{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#202027;padding:13px;border-radius:8px;margin:7px 0}.episode small{color:var(--muted)}.episode button{border:1px solid #555;background:transparent;color:#fff;padding:7px 10px;border-radius:6px}.episode button.done{background:var(--green);border-color:var(--green);color:#06130d}.select{background:#202027;border:1px solid #40404b;color:#fff;padding:9px;border-radius:8px}.menu-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modal-list{display:none;margin-top:10px;padding:12px;background:#1d1d25;border:1px solid #333340;border-radius:9px}.modal-list.open{display:block}.modal-list button{margin:4px;border:1px solid #444;background:#292933;color:#fff;border-radius:7px;padding:8px 10px}.modal-list button.on{background:var(--pink);border-color:var(--pink)}
.toast{position:fixed;right:20px;bottom:20px;background:#22222a;border:1px solid #444;padding:12px 16px;border-radius:9px;display:none;z-index:100}.connection-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.recent{display:flex;gap:10px;flex-wrap:wrap}.recent .chip{margin:0}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:scale(.98);opacity:.7}to{transform:scale(1);opacity:1}}
@media(max-width:800px){aside{width:64px;padding:20px 8px}.logo{font-size:0;padding:0 8px 25px}.logo:after{content:'W';font-size:25px;color:var(--pink)}.navbtn span,.side-title,.add-list,.small-del{display:none}main{margin-left:64px;width:calc(100% - 64px)}.top{padding:0 10px}.search{max-width:none}.drive-wrap .btn{font-size:0;padding:9px}.drive-wrap .btn:before{content:'☁';font-size:16px}.page{padding:20px 15px}.hero{padding:25px;min-height:320px}.hero h1{font-size:34px}.profile{grid-template-columns:1fr;text-align:center}.bigavatar{margin:auto}.calendar{grid-template-columns:repeat(2,1fr)}.connection-card{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<div class="app"><aside>
<div class="logo" onclick="go('home')">Watch<span>Time</span></div>
<button class="navbtn active" data-page="home">🏠 <span>Home</span></button>
<button class="navbtn" data-page="discover">🔎 <span>Discover</span></button>
<button class="navbtn" data-page="calendar">📅 <span>Calendar</span></button>
<button class="navbtn" data-page="profile">👤 <span>Profile & Analytics</span></button>
<div class="side-title">Your library</div>
<button class="navbtn" data-page="watched">✓ <span>Watched</span></button>
<button class="navbtn" data-page="plan">🕒 <span>Plan to Watch</span></button>
<button class="navbtn" data-page="favorites">♥ <span>Favorites</span></button>
<div id="customLists"></div><button class="add-list" onclick="createList()">＋ Create custom list</button>
</aside>
<main><header class="top"><input id="search" class="search" placeholder="Search TV shows..."><div class="drive-wrap"><button id="driveBtn" class="btn alt" style="padding:9px 13px" onclick="connectDrive()">☁ Connect Drive</button><span id="driveStatus" class="drive-status">● Connected</span></div><div class="avatar" onclick="go('profile')" title="Open profile">W</div></header><div class="page" id="page"></div></main></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div class="back" id="back"></div><div class="content"><h2 id="mtitle"></h2><div class="muted" id="mmeta"></div><p class="overview" id="moverview"></p><div class="actions"><button class="btn" onclick="addCurrent('watched')">✓ Add to Watched</button><button class="btn blue" onclick="addCurrent('plan')">＋ Add to Plan to Watch</button><button class="btn alt" onclick="addCurrent('favorites')">♥ Add to Favorites</button><button class="btn alt" onclick="toggleListMenu()">＋ Add to list…</button><button class="btn alt" onclick="closeModal()">Close</button></div><div class="modal-list" id="listMenu"></div><div class="season"><div class="season-head"><h3>Episodes</h3><div><select id="seasonSelect" class="select" onchange="loadSeason(this.value)"></select><button class="btn green" id="seasonAllBtn" onclick="toggleSeasonAll()">Watch All</button></div></div><div id="episodes"></div></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const IMG='https://image.tmdb.org/t/p/w500',BACK='https://image.tmdb.org/t/p/original';
const DEFAULT_LISTS={plan:[],favorites:[],watched:[]};
function read(key, fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
const state={page:'home',lists:read('wt_lists',DEFAULT_LISTS),watched:read('wt_watched',{}),categories:read('wt_categories',{}),cache:read('wt_cache',{}),activity:read('wt_activity',[]),current:null,currentDetails:null,currentEpisodes:[],currentSeason:null};
if(!state.lists.plan)state.lists.plan=[];if(!state.lists.favorites)state.lists.favorites=[];if(!state.lists.watched)state.lists.watched=[];
const page=document.getElementById('page');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch('/api/tmdb?path='+encodeURIComponent(path));if(!r.ok)throw Error('API error');return r.json()}
function save(){localStorage.setItem('wt_lists',JSON.stringify(state.lists));localStorage.setItem('wt_watched',JSON.stringify(state.watched));localStorage.setItem('wt_categories',JSON.stringify(state.categories));localStorage.setItem('wt_cache',JSON.stringify(state.cache));localStorage.setItem('wt_activity',JSON.stringify(state.activity.slice(-500)))}
function touchActivity(type,show,extra={}){state.activity.push({type,showId:show.id,title:show.name||show.title,category:getCategory(show.id),at:new Date().toISOString(),...extra});save()}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2000)}
function getCategory(id){return state.categories[id]||'TV Series'}
function idsForList(name){return state.lists[name]||[]}
function isIn(list,id){return idsForList(list).includes(Number(id))||idsForList(list).includes(String(id))}
function addId(list,id){if(!state.lists[list])state.lists[list]=[];if(!isIn(list,id))state.lists[list].push(Number(id));save()}
function removeId(list,id){if(!state.lists[list])return;state.lists[list]=state.lists[list].filter(x=>String(x)!==String(id));save()}
function card(s){state.cache[s.id]=s;const watchedCount=Object.keys(state.watched).filter(k=>k.startsWith(s.id+'-')).length;const tags=[];if(isIn('watched',s.id))tags.push('Watched');if(isIn('plan',s.id))tags.push('Plan');if(isIn('favorites',s.id))tags.push('♥');return `<div class="card" onclick='openShow(${JSON.stringify(s).replace(/'/g,"&#39;")})'><button class="quick" onclick='event.stopPropagation();openShow(${JSON.stringify(s).replace(/'/g,"&#39;")})'>＋</button><img class="poster" src="${IMG}${s.poster_path||''}" alt="${esc(s.name)}"><div class="info"><div class="name">${esc(s.name)}</div><div class="sub"><span class="star">★</span> ${(s.vote_average||0).toFixed(1)} · ${(s.first_air_date||'').slice(0,4)} · ${esc(getCategory(s.id))}</div>${watchedCount?`<div class="progress"><i style="width:${Math.min(100,watchedCount*10)}%"></i></div>`:''}${tags.length?`<div class="sub">${tags.join(' · ')}</div>`:''}</div></div>`}
function render(title,items,extra=''){items=items.filter(Boolean);page.innerHTML=`${extra}<div class="section"><div class="section-head"><h2>${esc(title)}</h2><span class="muted">${items.length} shows</span></div><div class="grid">${items.length?items.map(card).join(''):'<div class="empty">Nothing here yet.</div>'}</div></div>`}
async function home(){try{const d=await api('/trending/tv/week');const items=d.results||[];items.forEach(s=>state.cache[s.id]=s);const heroItems=items.filter(x=>x.backdrop_path||x.poster_path);const hero=heroItems[Math.floor(Math.random()*Math.max(1,heroItems.length))]||{};page.innerHTML=`<section class="hero" style="background-image:url('${BACK}${hero.backdrop_path||hero.poster_path||''}')"><div><h1>Track what you watch.</h1><p>Discover shows, follow episodes, build lists, and keep your viewing history in one place.</p><button class="btn" onclick="go('discover')">Discover shows</button></div></section><div class="section"><div class="section-head"><h2>Trending this week</h2></div><div class="grid">${items.slice(0,12).map(card).join('')}</div></div>`;save()}catch(e){page.innerHTML='<div class="empty">TMDB could not be loaded. Check your Vercel API key.</div>'}}
async function discover(q=''){try{const d=q?await api('/search/tv?query='+encodeURIComponent(q)):await api('/tv/popular');render(q?'Search results':'Popular TV shows',d.results||[])}catch(e){page.innerHTML='<div class="empty">Unable to load shows.</div>'}}
async function listPage(kind,title){const ids=idsForList(kind);const shows=await Promise.all(ids.map(id=>state.cache[id]||api('/tv/'+id).catch(()=>null)));render(title,shows.filter(Boolean),`<div class="section-head"><h2>${esc(title)}</h2><span class="muted">${ids.length} items</span></div>`)}
async function watched(){await listPage('watched','Watched')}
async function plan(){await listPage('plan','Plan to Watch')}
async function favorites(){await listPage('favorites','Favorites')}
async function customList(name){await listPage(name,name)}
function calendar(){let now=new Date(),days=[];for(let i=0;i<21;i++){let d=new Date(now);d.setDate(now.getDate()+i);days.push(`<div class="day"><strong>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</strong><div class="dot">• Upcoming episodes</div></div>`)}page.innerHTML=`<div class="section-head"><h2>Upcoming calendar</h2></div><p class="muted">Your calendar area is ready for episode air-date data.</p><div class="calendar">${days.join('')}</div>`}
function formatHours(minutes){return minutes<60?minutes+' min':(minutes/60).toFixed(1)+' h'}
function profile(){const watchedEpisodes=Object.keys(state.watched).length;const watchedShows=state.lists.watched.length;const cats={};Object.values(state.categories).forEach(c=>cats[c]=(cats[c]||0)+1);const epEvents=state.activity.filter(a=>a.type==='episodeWatched');const minutes=epEvents.reduce((n,a)=>n+(a.runtime||45),0);const last=state.activity.slice(-8).reverse();const catHtml=['Movie','TV Series','Anime','Game'].map(c=>`<span class="chip">${c}: ${cats[c]||0}</span>`).join('');page.innerHTML=`<div class="profile"><div class="bigavatar" onclick="go('profile')">W</div><div><h1 style="margin:0">WatchTime User</h1><p class="muted">Your personal viewing profile and analytics</p><div class="connection-card"><div><b>Google Drive</b><div class="muted" id="profileDriveText">${driveConnected?'Connected — sync stays available after refresh':'Not connected'}</div></div><button class="btn alt" onclick="${driveConnected?'disconnectDrive()':'connectDrive()'}">${driveConnected?'Disconnect':'Connect Drive'}</button></div></div></div><div class="section"><h2>Viewing analytics</h2><div class="analytics-grid"><div class="metric">Total watch time<b>${formatHours(minutes)}</b></div><div class="metric">Episodes watched<b>${watchedEpisodes}</b></div><div class="metric">Series watched<b>${watchedShows}</b></div><div class="metric">Favorites<b>${state.lists.favorites.length}</b></div><div class="metric">Plan to Watch<b>${state.lists.plan.length}</b></div></div></div><div class="section"><h2>Categories</h2><div>${catHtml||'<span class="muted">Choose a category on a show to start tracking.</span>'}</div></div><div class="section"><h2>Recent activity</h2><div class="recent">${last.length?last.map(a=>`<span class="chip">${esc(a.type==='episodeWatched'?'Watched episode: ':a.type==='added'?'Added: ':'Updated: ')}${esc(a.title||'Item')} · ${esc(a.category||'')}</span>`).join(''):'<span class="muted">No activity yet.</span>'}</div></div><div class="section"><h2>Optional game tracking</h2><p class="muted">Games are manual because this app currently uses TMDB TV search. Add a game to your library if you want it included in your analytics.</p><button class="btn alt" onclick="addGame()">＋ Add a game</button></div>`}
function refreshCustomLists(){const el=document.getElementById('customLists');const keys=Object.keys(state.lists).filter(k=>!['watched','plan','favorites'].includes(k));el.innerHTML=keys.map(k=>`<div class="custom-list-row"><button class="navbtn" data-custom="${esc(k)}">📁 <span>${esc(k)}</span></button><button class="small-del" title="Delete list" onclick="deleteList('${esc(k).replace(/'/g,"\\'")}')">×</button></div>`).join('');el.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{state.page='custom:'+b.dataset.custom;document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');customList(b.dataset.custom)})}
function createList(){const name=prompt('Name your new list:');if(!name||!name.trim())return;const n=name.trim();if(state.lists[n])return toast('That list already exists');state.lists[n]=[];save();refreshCustomLists();toast('List created')}
function deleteList(name){if(!confirm('Delete the list “'+name+'”? Shows are not deleted from other lists.'))return;delete state.lists[name];save();refreshCustomLists();go('home')}
async function go(p){state.page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')home();else if(p==='discover')discover();else if(p==='watched')watched();else if(p==='plan')plan();else if(p==='favorites')favorites();else if(p==='calendar')calendar();else if(p==='profile')profile();else if(p.startsWith('custom:'))customList(p.slice(7))}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){go('discover');discover(e.target.value.trim())}});
function renderListMenu(){const menu=document.getElementById('listMenu');const keys=Object.keys(state.lists);menu.innerHTML='<b>Add this show to:</b><br>'+keys.map(k=>`<button class="${isIn(k,state.current.id)?'on':''}" onclick="toggleList('${esc(k).replace(/'/g,"\\'")}')">${esc(k)} ${isIn(k,state.current.id)?'✓':''}</button>`).join('')+'<button onclick="createListFromModal()">＋ New list</button>'}
function toggleListMenu(){const m=document.getElementById('listMenu');renderListMenu();m.classList.toggle('open')}
function createListFromModal(){const name=prompt('New list name:');if(!name||!name.trim())return;const n=name.trim();if(state.lists[n])return toast('That list already exists');state.lists[n]=[];addId(n,state.current.id);refreshCustomLists();renderListMenu();toast('Added to '+n)}
function toggleList(name){if(isIn(name,state.current.id)){removeId(name,state.current.id);toast('Removed from '+name)}else{addId(name,state.current.id);toast('Added to '+name)};state.cache[state.current.id]=state.current;touchActivity('added',state.current,{list:name});renderListMenu();updateActionButtons()}
function addCurrent(kind){const id=state.current.id;state.cache[id]=state.current;if(kind==='watched')addId('watched',id);else if(kind==='plan')addId('plan',id);else if(kind==='favorites')addId('favorites',id);state.categories[id]=document.getElementById('categorySelect')?.value||getCategory(id);touchActivity('added',state.current,{list:kind});save();updateActionButtons();renderListMenu();toast(kind==='watched'?'Added to Watched':kind==='plan'?'Added to Plan to Watch':'Added to Favorites')}
function removeCurrent(kind){removeId(kind,state.current.id);updateActionButtons();renderListMenu();save();toast('Removed')}
function updateActionButtons(){const id=state.current.id;document.querySelector('.actions').innerHTML=`<button class="btn ${isIn('watched',id)?'green':''}" onclick="${isIn('watched',id)?"removeCurrent('watched')":"addCurrent('watched')"}">${isIn('watched',id)?'✓ In Watched':'✓ Add to Watched'}</button><button class="btn blue ${isIn('plan',id)?'green':''}" onclick="${isIn('plan',id)?"removeCurrent('plan')":"addCurrent('plan')"}">${isIn('plan',id)?'✓ In Plan to Watch':'＋ Add to Plan to Watch'}</button><button class="btn alt ${isIn('favorites',id)?'green':''}" onclick="${isIn('favorites',id)?"removeCurrent('favorites')":"addCurrent('favorites')"}">${isIn('favorites',id)?'♥ In Favorites':'♥ Add to Favorites'}</button><button class="btn alt" onclick="toggleListMenu()">＋ Add to list…</button><button class="btn alt" onclick="closeModal()">Close</button>`}
async function openShow(s){state.current=s;state.cache[s.id]=s;document.getElementById('modal').classList.add('open');document.getElementById('back').style.backgroundImage=`url(${BACK}${s.backdrop_path||s.poster_path||''})`;document.getElementById('mtitle').textContent=s.name||s.title;document.getElementById('mmeta').innerHTML=`${(s.first_air_date||'').slice(0,4)} · ★ ${(s.vote_average||0).toFixed(1)} · <select id="categorySelect" class="select" onchange="setCategory(this.value)"><option>TV Series</option><option>Anime</option><option>Movie</option><option>Game</option></select>`;document.getElementById('moverview').textContent=s.overview||'No overview available.';document.getElementById('categorySelect').value=getCategory(s.id);updateActionButtons();renderListMenu();document.getElementById('listMenu').classList.remove('open');document.getElementById('episodes').innerHTML='Loading episodes...';try{const d=await api('/tv/'+s.id);state.currentDetails=d;const seasons=(d.seasons||[]).filter(x=>x.season_number>0);const sel=document.getElementById('seasonSelect');sel.innerHTML=seasons.map(x=>`<option value="${x.season_number}">Season ${x.season_number}</option>`).join('');if(!seasons.length){document.getElementById('episodes').innerHTML='No episodes available.';document.getElementById('seasonAllBtn').style.display='none';return}document.getElementById('seasonAllBtn').style.display='inline-block';await loadSeason(seasons[0].season_number)}catch(e){document.getElementById('episodes').innerHTML='Episode data unavailable.'}}
function setCategory(c){state.categories[state.current.id]=c;state.cache[state.current.id]=state.current;touchActivity('category',state.current);toast('Category: '+c)}
async function loadSeason(n){if(!state.current)return;state.currentSeason=Number(n);document.getElementById('episodes').innerHTML='Loading...';try{const ep=await api('/tv/'+state.current.id+'/season/'+n);state.currentEpisodes=ep.episodes||[];renderEpisodes();updateSeasonButton()}catch(e){document.getElementById('episodes').innerHTML='Episode data unavailable.'}}
function renderEpisodes(){document.getElementById('episodes').innerHTML=state.currentEpisodes.map(x=>{const key=state.current.id+'-'+x.id,done=!!state.watched[key];return `<div class="episode"><span><b>E${x.episode_number}</b> — ${esc(x.name)}<br><small>${x.air_date||''}</small></span><button class="${done?'done':''}" onclick="toggleEp('${key}',this,${x.runtime||45})">${done?'✓ Watched':'Mark watched'}</button></div>`}).join('')||'<div class="empty">No episodes.</div>'}
function updateSeasonButton(){const all=state.currentEpisodes.length&&state.currentEpisodes.every(x=>!!state.watched[state.current.id+'-'+x.id]);document.getElementById('seasonAllBtn').textContent=all?'↺ Mark All Unwatched':'✓ Watch All';document.getElementById('seasonAllBtn').className='btn '+(all?'alt':'green')}
function toggleSeasonAll(){const all=state.currentEpisodes.length&&state.currentEpisodes.every(x=>!!state.watched[state.current.id+'-'+x.id]);state.currentEpisodes.forEach(x=>{const key=state.current.id+'-'+x.id;if(all)delete state.watched[key];else state.watched[key]=true;if(!all)touchActivity('episodeWatched',state.current,{runtime:x.runtime||45,episode:x.episode_number})});if(!all)addId('watched',state.current.id);save();backupProgress();renderEpisodes();updateSeasonButton();toast(all?'Season marked unwatched':'Season marked watched')}
function toggleEp(key,b,runtime){if(state.watched[key]){delete state.watched[key]}else{state.watched[key]=true;addId('watched',state.current.id);touchActivity('episodeWatched',state.current,{runtime:runtime||45})}save();backupProgress();b.classList.toggle('done',!!state.watched[key]);b.textContent=state.watched[key]?'✓ Watched':'Mark watched';updateSeasonButton();toast(state.watched[key]?'Episode marked watched':'Episode unmarked')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('listMenu').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function addGame(){const title=prompt('Game name:');if(!title||!title.trim())return;const id='game-'+Date.now();const game={id,name:title.trim(),title:title.trim(),poster_path:'',first_air_date:''};state.cache[id]=game;state.categories[id]='Game';addId('watched',id);touchActivity('added',game,{list:'watched'});save();toast('Game added to Watched')}
/* ================= GOOGLE DRIVE =================
   Google access tokens are intentionally NOT stored in localStorage.
   Instead, the app remembers that Drive was connected and asks Google for a
   silent token after refresh. Disconnect explicitly clears that remembered state.
*/
const GOOGLE_CLIENT_ID='119562103767-3jdsmbao6em287rn199n2cuceu0312k4.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata';const DRIVE_FILE_NAME='watchtime-progress.json';
let driveToken=null,driveFileId=localStorage.getItem('wt_drive_file_id')||null,tokenClient=null,driveConnected=localStorage.getItem('wt_drive_connected')==='1',driveReadyState=false;
function driveReady(){return GOOGLE_CLIENT_ID&&!GOOGLE_CLIENT_ID.startsWith('YOUR_')}
function initGoogle(){if(!driveReady()||!window.google?.accounts?.oauth2)return false;tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:async resp=>{if(resp.error){driveConnected=false;localStorage.removeItem('wt_drive_connected');updateDriveButton(false);toast('Drive needs to be connected again');return}driveToken=resp.access_token;driveConnected=true;localStorage.setItem('wt_drive_connected','1');updateDriveButton(true);await syncFromDrive()}});driveReadyState=true;return true}
function updateDriveButton(connected){const b=document.getElementById('driveBtn'),s=document.getElementById('driveStatus');if(!b)return;if(connected){b.textContent='☁ Drive connected';b.onclick=()=>driveMenu();if(s)s.style.display='inline'}else{b.textContent='☁ Connect Drive';b.onclick=connectDrive;if(s)s.style.display='none'}}
function driveMenu(){if(confirm('Google Drive is connected. Click OK to disconnect this WatchTime app from Drive.'))disconnectDrive()}
function connectDrive(){if(!driveReady()){alert('Add your Google OAuth Web Client ID in public/index.html first.');return}if(!tokenClient)initGoogle();setTimeout(()=>tokenClient?.requestAccessToken({prompt:driveConnected?'none':'consent'}),200)}
function disconnectDrive(){if(driveToken&&window.google?.accounts?.oauth2){try{google.accounts.oauth2.revoke(driveToken,()=>{})}catch(e){}}driveToken=null;driveConnected=false;driveFileId=null;localStorage.removeItem('wt_drive_connected');localStorage.removeItem('wt_drive_file_id');updateDriveButton(false);toast('Google Drive disconnected');if(state.page==='profile')profile()}
function drivePayload(){return JSON.stringify({version:2,savedAt:new Date().toISOString(),lists:state.lists,watched:state.watched,categories:state.categories,activity:state.activity,cache:state.cache})}
async function driveRequest(url,options={}){if(!driveToken)throw Error('Drive is not connected');const r=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+driveToken}});if(!r.ok)throw Error(await r.text());return r}
async function findDriveFile(){const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;const url='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=10&q='+encodeURIComponent(q);const data=await(await driveRequest(url)).json();return data.files?.[0]||null}
async function saveToDrive(){if(!driveToken)return;try{let id=driveFileId;if(!id){const existing=await findDriveFile();id=existing?.id||null}const body=drivePayload();if(id){await driveRequest('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body})}else{const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder'],mimeType:'application/json'},boundary='watchtime_'+Date.now(),multipart=['--'+boundary,'Content-Type: application/json; charset=UTF-8','',JSON.stringify(meta),'--'+boundary,'Content-Type: application/json','',body,'--'+boundary+'--',''].join('\r\n');const r=await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multipart});const d=await r.json();id=d.id}driveFileId=id;localStorage.setItem('wt_drive_file_id',id);updateDriveButton(true)}catch(e){console.warn('Drive save failed',e)}}
async function syncFromDrive(){try{const f=await findDriveFile();if(!f){await saveToDrive();toast('Drive backup created');return}driveFileId=f.id;localStorage.setItem('wt_drive_file_id',f.id);const data=await(await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media')).json();if(data){if(data.lists)state.lists={...DEFAULT_LISTS,...data.lists,...state.lists};if(data.watched)state.watched={...(data.watched||{}),...(state.watched||{})};if(data.categories)state.categories={...(data.categories||{}),...(state.categories||{})};if(Array.isArray(data.activity))state.activity=[...(data.activity||[]),...(state.activity||[])].slice(-500);if(data.cache)state.cache={...(data.cache||{}),...(state.cache||{})};save();refreshCustomLists();if(state.page==='home')home();else if(state.page==='profile')profile();toast('Progress synced from Google Drive');await saveToDrive()}}catch(e){console.warn('Drive sync failed',e);}}
let saveTimer;function backupProgress(){save();if(driveToken){clearTimeout(saveTimer);saveTimer=setTimeout(saveToDrive,700)}}
function attemptSilentDrive(){if(!driveConnected)return;if(!driveReadyState)initGoogle();setTimeout(()=>{if(tokenClient)tokenClient.requestAccessToken({prompt:'none'})},900)}
window.addEventListener('load',()=>{const wait=setInterval(()=>{if(window.google?.accounts?.oauth2){clearInterval(wait);initGoogle();updateDriveButton(driveConnected);attemptSilentDrive()}},200);setTimeout(()=>clearInterval(wait),10000);refreshCustomLists()});
refreshCustomLists();updateDriveButton(driveConnected);go('home');
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WatchTime — Track What You Watch</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#09090d;--panel:#111118;--panel2:#18181f;--line:#272731;--muted:#9a9aa5;--text:#fff;--pink:#ff315c;--green:#32d583;--yellow:#ffc857}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
aside{width:240px;background:#0d0d12;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:26px 16px;z-index:20}
.logo{font-size:26px;font-weight:900;color:var(--pink);padding:0 12px 32px}.logo span{color:#fff}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#9d9da8;padding:13px 12px;border-radius:9px;text-align:left;margin:3px 0}
.navbtn:hover,.navbtn.active{background:#1b1b23;color:#fff}.navbtn.active{color:var(--pink)}
.side-title{color:#666875;font-size:11px;text-transform:uppercase;padding:25px 12px 8px;letter-spacing:1px}
main{margin-left:240px;width:calc(100% - 240px)}
.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 35px;gap:18px;position:sticky;top:0;background:#09090df2;backdrop-filter:blur(12px);z-index:10}
.search{max-width:430px;width:100%;background:#15151d;border:1px solid var(--line);border-radius:24px;padding:11px 18px;color:#fff;outline:none}.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff315c,#8b5cf6);display:grid;place-items:center;font-weight:800}
.page{padding:32px 35px}.hero{min-height:330px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:36px;background:linear-gradient(90deg,#111 5%,#111c 48%,transparent),url('https://image.tmdb.org/t/p/original/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg') center/cover;margin-bottom:38px}
.hero h1{font-size:44px;margin:0 0 10px}.hero p{max-width:570px;color:#ccc;line-height:1.65;margin:0 0 20px}.btn{border:0;border-radius:8px;background:var(--pink);color:#fff;font-weight:800;padding:11px 18px}.btn.alt{background:#282832}.section{margin:30px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-head h2{margin:0;font-size:20px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #191922;border-radius:10px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-5px);border-color:#383844}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.info{padding:11px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:12px;margin-top:6px}.star{color:var(--yellow)}
.progress{height:4px;background:#292932;margin-top:9px;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink)}
.badge{position:absolute;top:9px;left:9px;background:#000b;border:1px solid #444;padding:5px 7px;border-radius:6px;font-size:11px}
.empty{border:1px dashed #34343e;padding:35px;border-radius:12px;text-align:center;color:var(--muted)}
.profile{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:center;background:var(--panel);padding:25px;border:1px solid var(--line);border-radius:15px}.bigavatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;background:linear-gradient(135deg,#ff315c,#7c3aed)}.stats{display:flex;gap:30px;margin-top:18px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:105px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}.day strong{font-size:12px}.dot{margin-top:9px;color:var(--pink);font-size:11px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#15151b;border:1px solid #30303a;border-radius:15px;position:relative}.back{height:300px;background:center/cover}.back:after{content:"";display:block;height:100%;background:linear-gradient(transparent,#15151b)}.close{position:absolute;right:16px;top:14px;z-index:3;width:36px;height:36px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:20px}.content{padding:0 32px 30px;margin-top:-65px;position:relative}.content h2{font-size:32px;margin:0 0 8px}.overview{color:#ccc;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}.season{margin-top:26px}.episode{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#202027;padding:13px;border-radius:8px;margin:7px 0}.episode small{color:var(--muted)}.episode button{border:1px solid #555;background:transparent;color:#fff;padding:7px 10px;border-radius:6px}.episode button.done{background:var(--green);border-color:var(--green);color:#06130d}
.toast{position:fixed;right:20px;bottom:20px;background:#22222a;border:1px solid #444;padding:12px 16px;border-radius:9px;display:none;z-index:100}
@media(max-width:800px){aside{width:64px;padding:20px 8px}.logo{font-size:0;padding:0 8px 25px}.logo:after{content:'W';font-size:25px;color:var(--pink)}.navbtn span,.side-title{display:none}main{margin-left:64px;width:calc(100% - 64px)}.top{padding:0 15px}.page{padding:20px 15px}.hero{padding:25px;min-height:320px}.hero h1{font-size:34px}.profile{grid-template-columns:1fr;text-align:center}.bigavatar{margin:auto}.stats{justify-content:center}.calendar{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div class="app">
<aside>
<div class="logo">Watch<span>Time</span></div>
<button class="navbtn active" data-page="home">🏠 <span>Home</span></button>
<button class="navbtn" data-page="discover">🔎 <span>Discover</span></button>
<button class="navbtn" data-page="watchlist">❤️ <span>Watchlist</span></button>
<button class="navbtn" data-page="calendar">📅 <span>Calendar</span></button>
<button class="navbtn" data-page="profile">👤 <span>Profile</span></button>
<div class="side-title">Your library</div>
<button class="navbtn" data-page="watched">✓ <span>Watched</span></button>
</aside>
<main>
<header class="top"><input id="search" class="search" placeholder="Search TV shows..."><button id="driveBtn" class="btn alt" style="margin-left:auto;padding:9px 13px" onclick="connectDrive()">☁ Connect Drive</button><div class="avatar">W</div></header>
<div class="page" id="page"></div>
</main></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div class="back" id="back"></div><div class="content"><h2 id="mtitle"></h2><div class="muted" id="mmeta"></div><p class="overview" id="moverview"></p><div class="actions"><button class="btn" id="watchBtn"></button><button class="btn alt" onclick="closeModal()">Close</button></div><div class="season"><h3>Episodes</h3><div id="episodes"></div></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const IMG='https://image.tmdb.org/t/p/w500',BACK='https://image.tmdb.org/t/p/original';
const state={page:'home',watch:JSON.parse(localStorage.getItem('wt_watch')||'[]'),watched:JSON.parse(localStorage.getItem('wt_watched')||'{}'),current:null};
const page=document.getElementById('page');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch('/api/tmdb?path='+encodeURIComponent(path));if(!r.ok)throw Error('API error');return r.json()}
function save(){localStorage.setItem('wt_watch',JSON.stringify(state.watch));localStorage.setItem('wt_watched',JSON.stringify(state.watched))}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function card(s){const watchedCount=Object.keys(state.watched).filter(k=>k.startsWith(s.id+'-')).length;return `<div class="card" onclick='openShow(${JSON.stringify(s).replace(/'/g,"&#39;")})'><img class="poster" src="${IMG}${s.poster_path||''}"><div class="info"><div class="name">${esc(s.name)}</div><div class="sub"><span class="star">★</span> ${(s.vote_average||0).toFixed(1)} · ${(s.first_air_date||'').slice(0,4)}</div>${watchedCount?`<div class="progress"><i style="width:${Math.min(100,watchedCount*10)}%"></i></div>`:''}</div>${state.watch.includes(s.id)?'<span class="badge">♥ In list</span>':''}</div>`}
function render(title,items,extra=''){page.innerHTML=`${extra}<div class="section"><div class="section-head"><h2>${title}</h2><span class="muted">${items.length} shows</span></div><div class="grid">${items.length?items.map(card).join(''):'<div class="empty">Nothing here yet.</div>'}</div></div>`}
async function home(){try{const d=await api('/trending/tv/week');const items=d.results||[];page.innerHTML=`<section class="hero"><div><h1>Track what you watch.</h1><p>Discover shows, follow episodes, build your watchlist and keep your viewing history in one place.</p><button class="btn" onclick="go('discover')">Discover shows</button></div></section>`;page.innerHTML+=`<div class="section"><div class="section-head"><h2>Trending this week</h2></div><div class="grid">${items.slice(0,12).map(card).join('')}</div></div>`}catch(e){page.innerHTML='<div class="empty">TMDB could not be loaded. Check your Vercel API key.</div>'}}
async function discover(q=''){try{const d=q?await api('/search/tv?query='+encodeURIComponent(q)):await api('/tv/popular');render(q?'Search results':'Popular TV shows',d.results||[])}catch(e){page.innerHTML='<div class="empty">Unable to load shows.</div>'}}
async function watchlist(){const shows=await Promise.all(state.watch.map(id=>api('/tv/'+id).catch(()=>null)));render('My Watchlist',shows.filter(Boolean))}
async function watched(){const ids=[...new Set(Object.keys(state.watched).map(k=>k.split('-')[0]))];const shows=await Promise.all(ids.map(id=>api('/tv/'+id).catch(()=>null)));render('Watched shows',shows.filter(Boolean))}
function calendar(){let now=new Date(), days=[];for(let i=0;i<21;i++){let d=new Date(now);d.setDate(now.getDate()+i);days.push(`<div class="day"><strong>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</strong><div class="dot">• Upcoming episodes</div></div>`)}page.innerHTML=`<div class="section-head"><h2>Upcoming calendar</h2></div><p class="muted">A calendar foundation is included; episode air-date syncing can be added to your database/backend.</p><div class="calendar">${days.join('')}</div>`}
function profile(){const watchedCount=Object.keys(state.watched).length;page.innerHTML=`<div class="profile"><div class="bigavatar">W</div><div><h1 style="margin:0">WatchTime User</h1><p class="muted">Your personal TV tracking profile</p><p class="muted">Google Drive backup: <b></b></p><div class="stats"><div class="stat"><b>${state.watch.length}</b><span>Watchlist</span></div><div class="stat"><b>${watchedCount}</b><span>Episodes watched</span></div><div class="stat"><b>${new Set(Object.keys(state.watched).map(x=>x.split('-')[0])).size}</b><span>Shows</span></div></div></div></div>`}
async function go(p){state.page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')home();else if(p==='discover')discover();else if(p==='watchlist')watchlist();else if(p==='watched')watched();else if(p==='calendar')calendar();else profile()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){go('discover');discover(e.target.value.trim())}});
async function openShow(s){state.current=s;document.getElementById('modal').classList.add('open');document.getElementById('back').style.backgroundImage=`url(${BACK}${s.backdrop_path||s.poster_path||''})`;document.getElementById('mtitle').textContent=s.name;document.getElementById('mmeta').textContent=`${(s.first_air_date||'').slice(0,4)} · ★ ${(s.vote_average||0).toFixed(1)}`;document.getElementById('moverview').textContent=s.overview||'No overview available.';updateWatch();document.getElementById('episodes').innerHTML='Loading episodes...';try{const d=await api('/tv/'+s.id);const seasons=(d.seasons||[]).filter(x=>x.season_number>0);const season=seasons[0];if(!season){document.getElementById('episodes').innerHTML='No episodes available.';return}const ep=await api('/tv/'+s.id+'/season/'+season.season_number);document.getElementById('episodes').innerHTML=(ep.episodes||[]).map(x=>{const key=s.id+'-'+x.id,done=!!state.watched[key];return `<div class="episode"><span><b>E${x.episode_number}</b> — ${esc(x.name)}<br><small>${x.air_date||''}</small></span><button class="${done?'done':''}" onclick="toggleEp('${key}',this)">${done?'✓ Watched':'Mark watched'}</button></div>`}).join('')}catch(e){document.getElementById('episodes').innerHTML='Episode data unavailable.'}}
function updateWatch(){document.getElementById('watchBtn').textContent=state.watch.includes(state.current.id)?'✓ In Watchlist':'+ Add to Watchlist';document.getElementById('watchBtn').onclick=()=>{const id=state.current.id;if(state.watch.includes(id))state.watch=state.watch.filter(x=>x!==id);else state.watch.push(id);backupProgress();updateWatch();toast(state.watch.includes(id)?'Added to watchlist':'Removed from watchlist')}}
function toggleEp(key,b){if(state.watched[key])delete state.watched[key];else state.watched[key]=true;backupProgress();b.classList.toggle('done',!!state.watched[key]);b.textContent=state.watched[key]?'✓ Watched':'Mark watched';toast(state.watched[key]?'Episode marked watched':'Episode unmarked')}
function closeModal(){document.getElementById('modal').classList.remove('open')}

/* ================= GOOGLE DRIVE BACKUP =================
   Uses Google's OAuth token client and the Drive appDataFolder.
   The user's progress is stored in a hidden app-specific JSON file.
*/
const GOOGLE_CLIENT_ID = '119562103767-3jdsmbao6em287rn199n2cuceu0312k4.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'watchtime-progress.json';
let driveToken = null;
let driveFileId = localStorage.getItem('wt_drive_file_id') || null;
let tokenClient = null;

function driveReady(){
  return GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('YOUR_');
}
function initGoogle(){
  if(!driveReady() || !window.google?.accounts?.oauth2) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){ toast('Google Drive authorization failed'); return; }
      driveToken = resp.access_token;
      updateDriveButton(true);
      await syncFromDrive();
    }
  });
}
window.addEventListener('load', ()=>setTimeout(initGoogle,700));

function updateDriveButton(connected){
  const b=document.getElementById('driveBtn');
  if(!b) return;
  b.textContent=connected?'☁ Drive connected':'☁ Connect Drive';
}

function connectDrive(){
  if(!driveReady()){
    alert('Add your Google OAuth Web Client ID in public/index.html first.');
    return;
  }
  if(!tokenClient) initGoogle();
  setTimeout(()=>tokenClient?.requestAccessToken({prompt: driveToken?'':'consent'}),300);
}

function drivePayload(){
  return JSON.stringify({
    version:1,
    savedAt:new Date().toISOString(),
    watch:state.watch,
    watched:state.watched
  });
}

async function driveRequest(url, options={}){
  if(!driveToken) throw Error('Drive is not connected');
  const r=await fetch(url,{...options,headers:{
    ...(options.headers||{}),
    Authorization:'Bearer '+driveToken
  }});
  if(!r.ok) throw Error(await r.text());
  return r;
}

async function findDriveFile(){
  const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;
  const url='https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&pageSize=10&q='+encodeURIComponent(q);
  const data=await (await driveRequest(url)).json();
  return data.files?.[0]||null;
}

async function saveToDrive(){
  if(!driveToken) return;
  try{
    let id=driveFileId;
    if(!id){
      const existing=await findDriveFile();
      id=existing?.id||null;
    }
    const body=drivePayload();
    if(id){
      await driveRequest('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(id)+'?uploadType=media',{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body
      });
    }else{
      const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder'],mimeType:'application/json'};
      const boundary='watchtime_'+Date.now();
      const multipart=[
        '--'+boundary,
        'Content-Type: application/json; charset=UTF-8','',
        JSON.stringify(meta),
        '--'+boundary,
        'Content-Type: application/json','',
        body,
        '--'+boundary+'--',''
      ].join('\r\n');
      const r=await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
        method:'POST',
        headers:{'Content-Type':'multipart/related; boundary='+boundary},
        body:multipart
      });
      const d=await r.json(); id=d.id;
    }
    driveFileId=id;
    localStorage.setItem('wt_drive_file_id',id);
    updateDriveButton(true);
  }catch(e){console.warn('Drive save failed',e);toast('Drive backup failed')}
}

async function syncFromDrive(){
  try{
    const f=await findDriveFile();
    if(!f){await saveToDrive();toast('Drive backup created');return}
    driveFileId=f.id;
    localStorage.setItem('wt_drive_file_id',f.id);
    const data=await (await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media')).json();
    if(data && Array.isArray(data.watch)){
      // Merge rather than overwrite, so connecting a new device cannot erase local progress.
      state.watch=[...new Set([...(state.watch||[]),...(data.watch||[])])];
      state.watched={...(data.watched||{}),...(state.watched||{})};
      save();
      if(state.page==='home') home();
      toast('Progress synced from Google Drive');
      await saveToDrive();
    }
  }catch(e){console.warn('Drive sync failed',e);toast('Drive sync failed')}
}

let saveTimer;
function backupProgress(){
  save();
  if(driveToken){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveToDrive,700);
  }
}

go('home');
</script></body></html>
